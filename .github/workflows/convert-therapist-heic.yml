name: Convert therapist portrait from HEIC
on:
  workflow_dispatch:
  push:
    branches:
      - yadcenter-seo-redesign
    paths:
      - ".github/workflows/convert-therapist-heic.yml"
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: yadcenter-seo-redesign
          fetch-depth: 0
      - name: Install Python HEIC decoder
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow pillow-heif
      - name: Convert original portrait to JPG
        run: |
          python - <<'PY'
          from pillow_heif import register_heif_opener
          from PIL import Image
          register_heif_opener()
          source = "therapists/IMG_20261117_194058_850.HEIC"
          target = "therapists/foruzan-shahla.jpg"
          with Image.open(source) as image:
              image.load()
              image.convert("RGB").save(target, "JPEG", quality=95, subsampling=0)
          print("Converted:", target)
          PY
          file therapists/foruzan-shahla.jpg
      - name: Commit converted portrait on development branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add therapists/foruzan-shahla.jpg
          if git diff --cached --quiet; then
            echo "No image changes to commit."
          else
            git commit -m "Replace therapist portrait with converted original"
            git push origin HEAD:yadcenter-seo-redesign
          fi
