name: Convert therapist portrait from HEIC
on:
  workflow_dispatch:
  push:
    branches:
      - yadcenter-seo-redesign
    paths:
      - ".github/workflows/convert-therapist-heic.yml"
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: yadcenter-seo-redesign
          fetch-depth: 0
      - name: Install HEIC converter
        run: |
          sudo apt-get update
          sudo apt-get install -y libheif-examples
      - name: Convert original portrait to browser-compatible JPG
        run: |
          heif-convert therapists/IMG_20261117_194058_850.HEIC therapists/foruzan-shahla.jpg
          file therapists/foruzan-shahla.jpg
      - name: Commit converted portrait on development branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add therapists/foruzan-shahla.jpg
          if git diff --cached --quiet; then
            echo "No image changes to commit."
          else
            git commit -m "Replace therapist portrait with converted original"
            git push origin HEAD:yadcenter-seo-redesign
          fi
