name: Validate YAD Center static site

on:
  push:
    branches: [main, yadcenter-seo-redesign]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate local links and PWA manifest
        run: node scripts/validate-site.mjs
      - name: Check browser JavaScript syntax
        run: |
          node --check app.js
          node --check therapist-profile.js
          node --check portal.js
          node --check site-i18n.js
          node --check service-guides-i18n.js
          node --check admin-workflow.js
          node --check admin-workflow-extended.js
          node --check client-workflow.js
          node --check client-extensions.js
          node --check admin-extensions.js
          node --check therapist-portal.js
          node --check workshops.js
          node --check pwa-install.js
          node --check sw.js
          node --check auth.js
      - name: Check Supabase schema security guardrails
        run: node scripts/validate-schema.mjs
      - name: Install Chromium for browser smoke tests
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run browser smoke tests
        run: node scripts/browser-smoke.mjs
